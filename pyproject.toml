[project]
name = "career-copilot"
version = "0.1.0"
description = "AI-powered career management platform for software engineering students"
readme = "README.md"
authors = [
    { name = "ChitrakshBhatia1", email = "chitraksh24164@iiitd.ac.in" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
career-copilot = "career_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
